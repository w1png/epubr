[package]
name = "epubr-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
docling = { version = "=2.65.1", default-features = false, features = ["pdf"] }

[dev-dependencies]
percent-encoding = "2.3"
roxmltree = "0.21"
tempfile = "3.27"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
