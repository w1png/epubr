[package]
name = "epubr-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
docling = { version = "=2.65.1", default-features = false, features = ["pdf"] }
directories-next = "2.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
percent-encoding = "2.3"
roxmltree = "0.21"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
