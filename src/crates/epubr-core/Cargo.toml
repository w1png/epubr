[package]
name = "epubr-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories-next = "2.0"
docling = { version = "=2.65.1", default-features = false, features = ["pdf"] }
docling-pdf = { version = "=2.65.1", default-features = false, features = ["render"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = { version = "0.45", default-features = false }
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zip = { version = "9.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
percent-encoding = "2.3"
